[package]
name = "file-station"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.4", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "compression-full", "trace", "fs"] }
serde = "1.0.229"
serde_json = "1.0.151"
jsonwebtoken = {version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lazy_static = "1.4.0"
thiserror = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
rust-embed = "8.7.2"
mime_guess = "2.0.4"
rand = "0.8.5"
argon2 = "0.4.1"
tracing = "0.1"
tracing-subscriber = { version="0.3", features = ["env-filter"] }
percent-encoding = "2.1.0"
